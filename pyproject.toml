[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpdistill"
version = "0.1.0"
description = "Independent model distillation and training studio"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rpdistill = "rpdistill.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
