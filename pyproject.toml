[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpdistill"
version = "0.1.0"
description = "Independent model distillation and training studio"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hub = ["huggingface_hub>=0.31,<2"]
modelscope = ["modelscope-hub>=0.7,<1"]
inference = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.4,<1"]
student = ["torch>=2.6,<3", "transformers>=4.51,<5", "safetensors>=0.4,<1", "sentencepiece>=0.2,<1"]

evaluation = ["sacrebleu>=2.4,<3"]

[project.scripts]
rpdistill = "rpdistill.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
