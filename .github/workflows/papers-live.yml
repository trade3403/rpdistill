name: Paper discovery live smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/rpdistill/papers.py'
      - 'scripts/papers_smoke.py'
      - 'src/rpdistill/ncbi_papers.py'
      - 'scripts/ncbi_papers_smoke.py'
      - '.github/workflows/papers-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  europe-pmc:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/papers_smoke.py

  ncbi-pmc:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python scripts/ncbi_papers_smoke.py
