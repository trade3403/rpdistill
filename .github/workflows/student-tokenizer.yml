name: Student tokenizer live parity
on:
  push:
    branches: [main]
    paths:
      - 'src/rpdistill/student.py'
      - 'src/rpdistill/training_data.py'
      - 'src/rpdistill/transfer.py'
      - 'scripts/student_tokenizer_smoke.py'
      - 'pyproject.toml'
      - '.github/workflows/student-tokenizer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tokenizer-parity:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: trade3403/ai-research-pdf-reader
          ref: 7f1fdb282bbdc947dc4a5d953768efaed429959d
          path: d-reference
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . 'transformers>=4.51,<5' 'sentencepiece>=0.2,<1' 'sacremoses>=0.1,<1'
      - run: cargo build --locked -p rpmodel --example marian_codec
        working-directory: d-reference/rptranslate
      - run: python scripts/student_tokenizer_smoke.py d-reference/rptranslate/target/debug/examples/marian_codec
