name: RPDistill Studio desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/studio_desktop_smoke.py'
      - 'src/rpdistill/**'
      - 'tests/test_studio.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ..
      - name: Launch real Electron and read persisted queue fixture
        run: python ../scripts/studio_desktop_smoke.py
