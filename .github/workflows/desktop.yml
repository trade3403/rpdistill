name: RPDistill Studio desktop
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/studio_desktop_smoke.py'
      - 'scripts/studio_prepare_windows_backend.py'
      - 'scripts/studio_installer_smoke.py'
      - 'src/rpdistill/**'
      - 'tests/test_studio.py'
      - 'tests/test_studio_environment.py'
      - 'pyproject.toml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ..
      - name: Launch real Electron and read persisted queue fixture
        run: python ../scripts/studio_desktop_smoke.py

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install -e ..
      - name: Stage offline base Python backend
        run: python ../scripts/studio_prepare_windows_backend.py --output build/backend
      - name: Build unsigned Windows NSIS candidate
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install launch and uninstall
        run: |
          $installer = Get-ChildItem dist-installer/*-setup.exe
          if (@($installer).Count -ne 1) { throw "Expected one installer" }
          python ../scripts/studio_installer_smoke.py --installer "$($installer.FullName)" --report "${{ runner.temp }}/rpdistill-installer-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-unsigned-installer-candidate
          path: |
            desktop/dist-installer/*-setup.exe
            ${{ runner.temp }}/rpdistill-installer-report.json
          if-no-files-found: error
          retention-days: 7

  windows-managed-cpu-environment:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Stage exact offline backend and wheel
        run: python scripts/studio_prepare_windows_backend.py --output desktop/build/backend
      - name: Deploy real CPU training environment from packaged backend
        run: |
          $base = (Get-Command python).Source
          $wheel = @(Get-ChildItem desktop/build/backend/wheels/rpdistill-*.whl)
          if ($wheel.Count -ne 1) { throw "Expected exact backend wheel" }
          $root = Join-Path $env:RUNNER_TEMP "rpdistill-managed-ci"
          & desktop/build/backend/python.exe -I -m rpdistill.studio_environment --python "$base" --wheel "$($wheel[0].FullName)" --root "$root" --profile cpu --approved
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = @(Get-ChildItem "$root/*/verified.json")
          if ($receipt.Count -ne 1) { throw "Expected one verified environment" }
          $r = Get-Content $receipt[0].FullName -Raw | ConvertFrom-Json
          if (!$r.runtime_verified -or $r.profile -ne "cpu" -or $r.wheel_sha256 -ne (Get-FileHash $wheel[0].FullName -Algorithm SHA256).Hash) { throw "Invalid receipt" }
          Get-Content $receipt[0].FullName
          $exe = Join-Path $receipt[0].DirectoryName "Scripts/python.exe"
          & $exe -I -m rpdistill --db "$root/probe.sqlite3" studio-snapshot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
