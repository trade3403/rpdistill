name: Design reference access and Windows visual build
on:
  push:
    branches: [feature/e11a-dashboard-visual]
    paths:
      - '.github/workflows/design-reference-preview.yml'
      - 'desktop/**'
      - 'src/rpdistill/**'
      - 'tests/test_studio.py'
      - 'tests/test_studio_evaluation.py'
      - 'tests/test_studio_artifacts.py'
      - 'tests/test_studio_reviews.py'
      - 'tests/test_studio_environment.py'
      - 'scripts/studio_desktop_smoke.py'
      - 'scripts/studio_prepare_windows_backend.py'
      - 'scripts/studio_installer_smoke.py'
      - 'scripts/studio_visual_compare.py'
      - 'scripts/studio_live_download_smoke.py'
      - 'tests/test_downloads.py'
      - 'pyproject.toml'
      - 'docs/assets/**'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - name: Verify original PNG and emit accessible preview
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io
          from PIL import Image
          p = Path('docs/assets/rpdistill-auto-distill-dashboard.png')
          raw = p.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          print('reference_sha256=' + sha)
          print('reference_bytes=' + str(len(raw)))
          assert sha == '8d0e37e1f408f11a955c9fdd9c9b17cd79850623d60b159754c14b458322b26b'
          with Image.open(p) as im:
              assert im.size == (1672, 941)
              print('reference_dimensions=' + str(im.size))
              preview = io.BytesIO()
              im.convert('RGB').save(preview, format='JPEG', quality=83, optimize=True)
              encoded = base64.b64encode(preview.getvalue()).decode('ascii')
              for i in range(0, len(encoded), 4096):
                  print('REFERENCE_PREVIEW:' + encoded[i:i+4096])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: original-design-reference
          path: docs/assets/rpdistill-auto-distill-dashboard.png
          retention-days: 3
  windows-visual-build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ..
      - run: python ../scripts/studio_desktop_smoke.py
        env:
          RPDISTILL_SMOKE_SCREENSHOT: ${{ runner.temp }}/rpdistill-dashboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dashboard-screenshot
          path: ${{ runner.temp }}/rpdistill-dashboard.png
          if-no-files-found: error
          retention-days: 7
      - run: python -m pip install Pillow
      - name: Compare native screenshot with original reference
        run: python ../scripts/studio_visual_compare.py --reference ../docs/assets/rpdistill-auto-distill-dashboard.png --actual "${{ runner.temp }}/rpdistill-dashboard.png" --output "${{ runner.temp }}/rpdistill-visual-comparison"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-reference-comparison
          path: ${{ runner.temp }}/rpdistill-visual-comparison
          if-no-files-found: error
          retention-days: 7
      - name: Emit screenshot preview for visual review
        env:
          RPDISTILL_SMOKE_SCREENSHOT: ${{ runner.temp }}/rpdistill-dashboard.png
        run: |
          python -c "import os,io,base64; from PIL import Image; im=Image.open(os.environ['RPDISTILL_SMOKE_SCREENSHOT']).convert('RGB'); assert im.width>800 and im.height>500; assert len(im.getcolors(2) or [])!=1; b=io.BytesIO(); im.save(b,format='JPEG',quality=83); s=base64.b64encode(b.getvalue()).decode(); print('screenshot_dimensions='+str(im.size)); [print('STUDIO_PREVIEW:'+s[i:i+4096]) for i in range(0,len(s),4096)]"
  live-download-recovery:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[hub]'
      - run: python scripts/studio_live_download_smoke.py
      - name: Download and verify fixed student tokenizer assets
        run: |
          python -m rpdistill student-assets --root "${{ runner.temp }}/rpdistill-student-assets" --max-bytes 4194304
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m rpdistill student-info --assets "${{ runner.temp }}/rpdistill-student-assets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install -e ..
      - name: Stage offline base Python backend
        run: python ../scripts/studio_prepare_windows_backend.py --output build/backend
      - name: Build unsigned Windows NSIS candidate
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install launch and uninstall
        run: |
          $installer = Get-ChildItem dist-installer/*-setup.exe
          if (@($installer).Count -ne 1) { throw "Expected one installer" }
          python ../scripts/studio_installer_smoke.py --installer "$($installer.FullName)" --report "${{ runner.temp }}/rpdistill-installer-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-unsigned-installer-candidate
          path: |
            desktop/dist-installer/*-setup.exe
            ${{ runner.temp }}/rpdistill-installer-report.json
          if-no-files-found: error
          retention-days: 7

  windows-managed-cpu-environment:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Stage exact offline backend and wheel
        run: python scripts/studio_prepare_windows_backend.py --output desktop/build/backend
      - name: Deploy real CPU training environment from packaged backend
        run: |
          $base = (Get-Command python).Source
          $wheel = @(Get-ChildItem desktop/build/backend/wheels/rpdistill-*.whl)
          if ($wheel.Count -ne 1) { throw "Expected exact backend wheel" }
          $root = Join-Path $env:RUNNER_TEMP "rpdistill-managed-ci"
          & desktop/build/backend/python.exe -I -m rpdistill.studio_environment --python "$base" --wheel "$($wheel[0].FullName)" --root "$root" --profile cpu --approved
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = @(Get-ChildItem "$root/*/verified.json")
          if ($receipt.Count -ne 1) { throw "Expected one verified environment" }
          $r = Get-Content $receipt[0].FullName -Raw | ConvertFrom-Json
          if (!$r.runtime_verified -or $r.profile -ne "cpu" -or $r.wheel_sha256 -ne (Get-FileHash $wheel[0].FullName -Algorithm SHA256).Hash) { throw "Invalid receipt" }
          Get-Content $receipt[0].FullName
          $exe = Join-Path $receipt[0].DirectoryName "Scripts/python.exe"
          & $exe -I -m rpdistill --db "$root/probe.sqlite3" studio-snapshot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recheck actual registered environment and reject tampered receipt
        run: |
          $root = Join-Path $env:RUNNER_TEMP "rpdistill-managed-ci"
          $wheel = @(Get-ChildItem desktop/build/backend/wheels/rpdistill-*.whl)
          $receipt = @(Get-ChildItem "$root/*/verified.json")
          if ($wheel.Count -ne 1 -or $receipt.Count -ne 1) { throw "Missing deployment evidence" }
          $id = $receipt[0].Directory.Name
          & desktop/build/backend/python.exe -I -m rpdistill.studio_environment --wheel "$($wheel[0].FullName)" --root "$root" --recheck-id "$id" --approved
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $original = Get-Content $receipt[0].FullName -Raw
          try {
            $bad = $original | ConvertFrom-Json
            $bad.wheel_sha256 = "0" * 64
            $bad | ConvertTo-Json -Compress | Set-Content $receipt[0].FullName -Encoding utf8
            & desktop/build/backend/python.exe -I -m rpdistill.studio_environment --wheel "$($wheel[0].FullName)" --root "$root" --recheck-id "$id" --approved
            if ($LASTEXITCODE -eq 0) { throw "Tampered receipt accepted" }
            Write-Output "tampered_environment_receipt_rejected=true"
          } finally {
            Set-Content $receipt[0].FullName -Value $original -Encoding utf8 -NoNewline
          }
          & desktop/build/backend/python.exe -I -m rpdistill.studio_environment --wheel "$($wheel[0].FullName)" --root "$root" --recheck-id "$id" --approved
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
