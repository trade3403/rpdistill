name: RPDistill CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m rpdistill
      - run: python -m rpdistill devices

  sdk-compatibility:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[hub,modelscope]'
      - run: python -c "from rpdistill.teachers import hub_client; from rpdistill.modelscope_source import client; assert callable(hub_client().model_info); assert callable(client().download_file)"

  real-cpu-inference:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[inference]'
      - run: python scripts/inference_smoke.py
