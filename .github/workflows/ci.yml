name: RPDistill CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-tests:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m rpdistill
      - run: python -m rpdistill devices

  sdk-compatibility:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[hub,modelscope]'
      - run: python -c "from rpdistill.teachers import hub_client; from rpdistill.modelscope_source import client; assert callable(hub_client().model_info); assert callable(client().download_file)"

  real-cpu-inference:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[inference]'
      - run: python scripts/inference_smoke.py

  real-cpu-student:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.7.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[student,evaluation]'
      - run: python scripts/student_smoke.py
      - run: python scripts/distill_smoke.py
      - run: python scripts/resume_smoke.py
      - run: python scripts/training_queue_smoke.py
      - run: python scripts/student_evaluation_smoke.py
      - name: GPU acceptance must fail closed on CPU-only runtime
        run: |
          python - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          import torch
          assert not torch.cuda.is_available()
          with tempfile.TemporaryDirectory() as tmp:
              p=Path(tmp)/"gpu-report.json"
              args=[sys.executable,"scripts/studio_gpu_acceptance.py","--device","cuda:0",
                    "--precision","float32","--cuda-budget-bytes",str(6*1024**3),"--report",str(p)]
              result=subprocess.run(args,capture_output=True,timeout=30)
              assert result.returncode!=0 and not p.exists(),"missing approval accepted"
              result=subprocess.run(args+["--approved"],capture_output=True,timeout=60)
              assert result.returncode!=0,"CPU-only runtime accepted as GPU"
              report=json.loads(p.read_text(encoding="utf-8"))
              assert report["local_gpu_smoke_pass"] is False and report["real_cuda_tensor"] is False
              assert report["release_ready"] is False and report["error"]=="ValueError"
              assert "tokenizer" not in report,"asset download before CUDA preflight"
              print("gpu_unavailable_rejected=true; actual_gpu_acceptance=false")
          PY

  real-evaluation:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[evaluation]'
      - run: python scripts/evaluation_smoke.py
